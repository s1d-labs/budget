name: check

# Verifies this family on every push: parsing tests on saved pages (pytest), then scrape-check, which runs setup_family.py and the
# G02 tasks against a local stand-in for scrape-hub, the same way the pool runner does, on 2 real queue items each.
# Nothing reaches the real hub. Run it by hand too: Actions -> check -> Run workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt pytest "scrape-hub-client @ git+https://github.com/s1d-labs/runner@main#subdirectory=sdk"
          python3 -c "import json; [print(c) for c in json.load(open('scrape.json')).get('setup', [])]" | grep -v "requirements.txt" | while IFS= read -r cmd; do bash -c "$cmd"; done
      - name: Parsing tests
        run: python -m pytest tests -q
      - name: scrape-check budget-obi-states (local stand-in hub, both real items)
        run: rc=0; scrape-check --project budget-obi-states --items 2 || rc=$?; mv .scrape-check .scrape-check-obi-states; exit $rc
      # G01 (budget-union-docs) is parked and not tested: www.indiabudget.gov.in answers 403 to this scraper.
      # G03 (budget-pfms*) is covered by the parsing tests only: pfms.gov.in answers only from India (it runs through the hub's Indian proxies).
      # informational: web.archive.org's CDX index is slow (~30 s) and often answers 503/502 for a while; the pool retries those
      - name: scrape-check budget-obi-wayback (2 real prefixes from web.archive.org)
        if: ${{ always() }}
        continue-on-error: true
        run: rc=0; scrape-check --project budget-obi-wayback --items 2 --no-rerun --timeout 900 || rc=$?; mv .scrape-check .scrape-check-obi-wayback; exit $rc
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: scrape-check
          path: |
            .scrape-check-obi-states/
            .scrape-check-obi-wayback/
          if-no-files-found: ignore
          include-hidden-files: true
